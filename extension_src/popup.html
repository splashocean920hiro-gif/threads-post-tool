<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
body{width:290px;margin:0;padding:14px;font-family:-apple-system,'Hiragino Sans',sans-serif;
     background:#faf8f5;color:#2b2b2b;font-size:13px;line-height:1.6}
h1{font-size:14px;margin:0 0 10px}
#st{background:#f2efe9;border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:12px}
#st.run{background:#e7f3ec;color:#2e7d5b}
.btn{display:block;width:100%;padding:9px;border:0;border-radius:6px;background:#5b4b8a;
     color:#fff;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:8px}
.btn.sub{background:#eee;color:#444}
.note{color:#8a8178;font-size:11px}
</style></head>
<body>
<h1>Threads リサーチ</h1>
<div id="st">読み込み中…</div>
<button class="btn" id="open">操作画面を開く</button>
<button class="btn sub" id="stop">停止</button>
<div class="note">調査と収集は操作画面から始めます。操作画面を閉じると停止します。</div>
<script src="popup.js"></script>
</body></html>
